name = "acmehr-chatbot"
main = "src/index.js"
compatibility_date = "2026-05-21"

# =========================================================================
# 🛑 ENVIRONMENT A: DEFAULT / MACEDA (kobimaceda.com)
# =========================================================================
[ai]
binding = "AI"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "acmehr-docs"

[[routes]]
pattern = "hr.kobimaceda.com/*"
zone_name = "kobimaceda.com"

[[routes]]
pattern = "admin.kobimaceda.com/*"
zone_name = "kobimaceda.com"

[[d1_databases]]
binding = "DB"
database_name = "acmehr-db"
database_id = "fadb9c42-93a0-42da-866d-71ed506ceedc"

# =========================================================================
# 🧪 ENVIRONMENT B: TAN (kobitan.work)
# =========================================================================
[env.tan]
name = "acmehr-chatbot-tan"

# Explicitly bind the AI hardware to the Tan environment
ai = { binding = "AI" }

[[env.tan.routes]]
pattern = "hr.kobitan.work/*"
zone_name = "kobitan.work"

[[env.tan.routes]]
pattern = "admin.kobitan.work/*"
zone_name = "kobitan.work"

# Explicitly bind the R2 file vault to the Tan environment
[[env.tan.r2_buckets]]
binding = "DOCS"
bucket_name = "acmehr-docs"

# Explicitly bind the D1 database instance to the Tan environment
[[env.tan.d1_databases]]
binding = "DB"
database_name = "acmehr-db"
database_id = "03d73537-3e8b-4332-9fc8-c23876c5faac"
