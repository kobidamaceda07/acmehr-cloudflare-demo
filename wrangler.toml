name = "acmehr-chatbot"
main = "src/index.js"
compatibility_date = "2026-05-21"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "acmehr-docs"

# =========================================================================
# 🛑 PROFILE A: DEFAULT ENVIRONMENT (kobimaceda.com)
# =========================================================================
[[routes]]
pattern = "hr.kobimaceda.com/*"
zone_name = "kobimaceda.com"

[[routes]]
pattern = "admin.kobimaceda.com/*"
zone_name = "kobimaceda.com"

[[d1_databases]]
binding = "DB"
database_name = "acmehr-db"
database_id = "fadb9c42-93a0-42da-866d-71ed506ceedc"

# =========================================================================
# 🧪 PROFILE B: TAN ENVIRONMENT (kobitan.work)
# =========================================================================
[env.tan]
name = "acmehr-chatbot-tan"

[[env.tan.routes]]
pattern = "hr.kobitan.work/*"
zone_name = "kobitan.work"

[[env.tan.routes]]
pattern = "admin.kobitan.work/*"
zone_name = "kobitan.work"

[[env.tan.d1_databases]]
binding = "DB"
database_name = "acmehr-db"
database_id = "03d73537-3e8b-4332-9fc8-c23876c5faac"
