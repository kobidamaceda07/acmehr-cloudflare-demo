name: Deploy Multi-Tenant Stack
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tenant:
        description: 'Select Destination Cloudflare Tenant:'
        required: true
        default: 'maceda'
        type: choice
        options:
          - maceda
          - tan

# ✨ Suppresses the warning and forces the GitHub runner to use the Node 24 architecture safely
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # 🌐 AUTOMATION TASK A: DEPLOYS TO KOBIMACEDA.COM
  deploy-maceda:
    if: ${{ github.event.inputs.tenant == 'maceda' || github.event.inputs.tenant == '' }}
    runs-on: ubuntu-latest
    environment: maceda-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 🔥 Upgraded engine context to Node 24
      - run: npm install
      - name: Push to Mace Account Edge
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # 🧪 AUTOMATION TASK B: DEPLOYS TO KOBITAN.WORK
  deploy-tan:
    if: ${{ github.event.inputs.tenant == 'tan' }}
    runs-on: ubuntu-latest
    environment: tan-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 🔥 Upgraded engine context to Node 24
      - run: npm install
      - name: Push to Tan Account Edge
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env tan
